version: '3.8'

services:
  agrishield-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agrishield_web
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=agrishield_production_secret_key_change_in_prod
      - DATABASE_URL=sqlite:///app/farmer_app.db
    volumes:
      - agrishield_data:/app/app/static/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  agrishield_data:
