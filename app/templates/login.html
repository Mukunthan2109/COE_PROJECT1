{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card card-custom p-4">
            <h4 class="fw-bold text-success mb-3 text-center">User Login</h4>
            <form action="{{ url_for('main.login', next=request.args.get('next', '')) }}" method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username" required placeholder="Enter username">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required placeholder="Enter password">
                </div>
                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-farmer py-2">Sign In</button>
                </div>
            </form>
            <div class="text-center small text-muted">
                Don't have an account? <a href="{{ url_for('main.register') }}" class="text-success fw-bold">Register here</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
