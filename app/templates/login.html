{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card card-custom p-4">
            <h4 class="fw-bold text-success mb-3 text-center" data-i18n="btn_login">{{ t('btn_login') }}</h4>
            <form action="{{ url_for('main.login', next=request.args.get('next', '')) }}" method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label" data-i18n="label_username">{{ t('label_username') }}</label>
                    <input type="text" class="form-control" id="username" name="username" required data-i18n-placeholder="placeholder_username" placeholder="{{ t('placeholder_username') }}">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label" data-i18n="label_password">{{ t('label_password') }}</label>
                    <input type="password" class="form-control" id="password" name="password" required data-i18n-placeholder="placeholder_password" placeholder="{{ t('placeholder_password') }}">
                </div>
                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-farmer py-2" data-i18n="btn_login">{{ t('btn_login') }}</button>
                </div>
            </form>
            <div class="text-center small text-muted">
                <span data-i18n="no_account">{{ t('no_account') }}</span> <a href="{{ url_for('main.register') }}" class="text-success fw-bold" data-i18n="btn_register">{{ t('btn_register') }}</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
