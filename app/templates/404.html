{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-8 text-center">
        <div class="card card-custom p-5 border-0 shadow">
            <div class="display-1 text-success mb-3">404</div>
            <h2 class="fw-bold text-dark mb-3">Page Not Found / பக்கம் காணப்படவில்லை</h2>
            <p class="text-muted fs-5 mb-4">
                The requested page or observation record could not be found. Please check the web address or navigate back to the home page.
            </p>
            <div>
                <a href="{{ url_for('main.index') }}" class="btn btn-agri-green py-2 px-4 fs-5 fw-bold">
                    🏠 Return to Home
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
