{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-8 text-center">
        <div class="card card-custom p-5 border-0 shadow border-top border-4 border-danger">
            <div class="display-1 text-danger mb-3">500</div>
            <h2 class="fw-bold text-dark mb-3">Application Error / பயன்பாட்டு பிழை</h2>
            <p class="text-muted fs-5 mb-4">
                An unexpected system processing error occurred. Our team has been notified. Please try retrying your observation submission.
            </p>
            <div>
                <a href="{{ url_for('main.observe') }}" class="btn btn-agri-yellow py-2 px-4 fs-5 fw-bold me-2">
                    📷 New Observation
                </a>
                <a href="{{ url_for('main.index') }}" class="btn btn-outline-secondary py-2 px-4 fs-5">
                    🏠 Home
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
