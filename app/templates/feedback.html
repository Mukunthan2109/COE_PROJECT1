{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card card-custom p-4">
            <h3 class="fw-bold text-success mb-2 text-center" data-i18n="feedback_title">⭐ {{ t('feedback_title') }}</h3>
            <p class="text-muted small text-center mb-4" data-i18n="feedback_sub">{{ t('feedback_sub') }}</p>

            <form action="{{ url_for('main.feedback') }}" method="POST">
                <div class="mb-3">
                    <label for="user_role" class="form-label" data-i18n="label_your_role">{{ t('label_your_role') }} *</label>
                    <select class="form-select" id="user_role" name="user_role" required>
                        <option value="Farmer" selected data-i18n="role_farmer">{{ t('role_farmer') }}</option>
                        <option value="Agronomist" data-i18n="role_expert">{{ t('role_expert') }}</option>
                        <option value="QA Manager" data-i18n="role_processor">{{ t('role_processor') }}</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="rating" class="form-label" data-i18n="label_usability_rating">{{ t('label_usability_rating') }} *</label>
                    <select class="form-select" id="rating" name="rating" required>
                        <option value="5" selected>⭐⭐⭐⭐⭐ (5/5)</option>
                        <option value="4">⭐⭐⭐⭐ (4/5)</option>
                        <option value="3">⭐⭐⭐ (3/5)</option>
                        <option value="2">⭐⭐ (2/5)</option>
                        <option value="1">⭐ (1/5)</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label for="comments" class="form-label" data-i18n="label_comments">{{ t('label_comments') }}</label>
                    <textarea class="form-control" id="comments" name="comments" rows="3" data-i18n-placeholder="placeholder_feedback" placeholder="{{ t('placeholder_feedback') }}"></textarea>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-farmer py-2" data-i18n="btn_submit_feedback">{{ t('btn_submit_feedback') }}</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
